name: Build image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write          # allows pushing to ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # ARM machine: same CPU type as the k3d cluster on the M5 Mac
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zafaruralov/zafarr-backend:${{ github.sha }}
            ghcr.io/zafaruralov/zafarr-backend:latest

  # After the image exists: write its tag into zafarr-infra. ArgoCD sees that commit and deploys it.
  bump-infra:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zafaruralov/zafarr-infra
          token: ${{ secrets.INFRA_TOKEN }}   # permission to push to the infra repo

      - name: Update image tag
        run: |
          sed -i "s|ghcr.io/zafaruralov/zafarr-backend:.*|ghcr.io/zafaruralov/zafarr-backend:${{ github.sha }}|" apps/backend/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "backend: deploy ${GITHUB_SHA::7}"
          git push
